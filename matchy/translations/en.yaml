---
configuration:
  source_folders:
    name: Picture folders
    description: >-
      Folders of pictures, scanned with their sub-folders. They must be under /media or /share.
  exclude:
    name: Leave out
    description: >-
      Picture ids to keep out of the library, as patterns such as aether-* (ids are listed in the
      sidebar panel).
  sets:
    name: Sub-folder settings
    description: >-
      Settings for a sub-folder of the picture folders, matched by its name.
    fields:
      folder:
        name: Sub-folder
        description: The sub-folder's name, e.g. art.
      id_prefix:
        name: Id prefix
        description: Picture ids in this sub-folder become <prefix>-<file name>.
      name:
        name: Collection name
        description: What the captioner is told the collection is called.
      credit:
        name: Credit
        description: Shown on the label when a picture has no credit of its own.
      context:
        name: Context
        description: One sentence of facts the captioner may use.
      abstract:
        name: Abstract art
        description: >-
          On for digital or illustrated art, so a caption describes it as art and never as a
          real place.
  rotation_min_minutes:
    name: Shortest time on one picture
    description: >-
      Minutes. The sidebar panel's How often slider overrides both times until these options
      change.
  rotation_max_minutes:
    name: Longest time on one picture
    description: Minutes. Each interval is picked at random between the two.
  love_weight:
    name: Loved pictures
    description: >-
      How many times as often a picture with a heart comes up (hearts are given in the sidebar
      panel or with the love API). 1 means a heart changes nothing.
  quiet_hours:
    name: Quiet hours
    description: >-
      Off unless both times are set. During quiet hours the picture is held, and screens that use
      the /current/ addresses get it dimmed.
    fields:
      start:
        name: Start
        description: Local time, e.g. 23:00.
      end:
        name: End
        description: Local time, e.g. 07:00. Earlier than the start means the next morning.
      hold:
        name: Hold the picture
        description: >-
          Keep one picture all night (default on). The rotation resumes with a full interval when
          quiet hours end.
      dim:
        name: Dim
        description: >-
          How much darker the picture is, from 0 (not at all) to 1 (black). Default 0.6.
  folder_scan_minutes:
    name: Folder check
    description: Minutes between looks for new, changed or removed pictures.
  master_max_px:
    name: Master size
    description: >-
      Longest edge, in pixels, of the copy every render is cut from. Larger is sharper on big
      screens and slower to build.
  cache_max_mb:
    name: Render cache
    description: Megabytes of rendered pictures to keep; the least recently used go first.
  render_threads:
    name: Render threads
    description: Pictures rendered at the same time.
  focus_auto:
    name: Crop around the subject
    description: >-
      Crop each screen's picture around its main subject instead of the centre: the subject the
      captioner points out, or else where the picture has the most detail. Off: centred crops. A
      focus point set by hand in the sidebar panel is used either way.
  caption_enabled:
    name: Gallery captions
    description: >-
      Write a short blurb for each picture with a vision model. Off: nothing is captioned, and a
      picture without a blurb shows the title and credit only.
  caption_language:
    name: Caption language
    description: The language the blurb is asked for.
  caption_spelling:
    name: Spelling
    description: British also corrects common American spellings in what comes back.
  caption_min_words:
    name: Shortest caption
    description: Words. A shorter blurb is asked for again.
  caption_max_words:
    name: Longest caption
    description: Words. A longer blurb is asked for again.
  caption_kids:
    name: Kids captions
    description: >-
      Also write a second, shorter blurb for children aged 5 to 9 (15 to 30 simple words and one fun
      fact), after every normal caption is done. Screens ask for it with ?label=kids.
  captioners:
    name: Captioners
    description: >-
      OpenAI-compatible vision servers (llama.cpp, Ollama, LM Studio or a cloud API), tried in
      order. One that fails is skipped for ten minutes.
    fields:
      name:
        name: Name
        description: A label for the logs.
      url:
        name: URL
        description: The full chat completions address, ending in /v1/chat/completions.
      model:
        name: Model
        description: The model name as the server knows it.
      api_key:
        name: API key
        description: Only for servers that need one.
      timeout:
        name: Timeout
        description: Seconds to wait for one caption (default 120).
  the_met:
    name: The Met
    description: >-
      Public-domain highlights from The Metropolitan Museum of Art's open API, credited on the
      label.
    fields:
      enabled:
        name: Turned on
        description: Off by default.
      per_day:
        name: New pictures a day
        description: How many works to add each day.
      min_px:
        name: Smallest picture
        description: >-
          Pixels on the long side. Works with a smaller image are skipped (default 2560).
  wikimedia_picture_of_the_day:
    name: Wikimedia Commons Picture of the Day
    description: >-
      The Picture of the Day from Wikimedia Commons, credited with its author and licence.
    fields:
      enabled:
        name: Turned on
        description: Off by default.
      per_day:
        name: New pictures a day
        description: 1 takes today's picture; more also fills in the previous days.
      min_px:
        name: Smallest picture
        description: >-
          Pixels on the long side. Works with a smaller image are skipped (default 2560).
  palette_enabled:
    name: Colour match
    description: >-
      Work out each picture's main colours and an accent, shown under the picture in the panel and
      given to clients (a desktop accent colour, a dashboard theme, lights). Off: the colour fields
      stay empty.
  mood:
    name: Mood-aware picks
    description: >-
      Off: pictures come up in a plain shuffle. Light or strong: a picture whose tags fit the
      moment (the weather, the season, the time of day) is pulled forward more or less often. Every
      picture still comes up once per shuffle.
  weather_entity:
    name: Weather entity
    description: >-
      Optional. A Home Assistant weather entity, e.g. weather.forecast_home, read every ten minutes
      for the mood-aware picks. Without it only the season and the time of day count.
  remote_manifest_url:
    name: Remote folder
    description: >-
      Optional. A web folder with a manifest.json listing pictures to download, checked once a
      day.
  daily_json_url:
    name: Picture of the day (details)
    description: >-
      Optional. A JSON document describing a picture that changes daily. Needs the image address
      below too.
  daily_image_url:
    name: Picture of the day (image)
    description: Optional. The image that goes with the details above.
  mqtt_enabled:
    name: Home Assistant entities
    description: >-
      Create a Matchy Wallpapers device in Home Assistant over MQTT (needs the Mosquitto broker
      add-on): the picture on screen, its title and caption, Next, Pause, how often, and a switch
      per screen. Turning it off removes them again.
  mqtt_image_url:
    name: Picture address for Home Assistant
    description: >-
      Optional. Where Home Assistant fetches the picture for the image entity, such as
      http://<your Home Assistant address>:<published port>. Leave empty to use the add-on's own
      address inside Home Assistant.
network:
  8160/tcp: >-
    For screens other than the sidebar panel: desktops, wall tablets, dashboard backgrounds.
    Leave it empty and only the panel works.
